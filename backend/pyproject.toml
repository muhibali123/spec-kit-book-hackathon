[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-service"
version = "0.1.0"
description = "Retrieval & Context Filtering Service for RAG systems"
authors = [{name = "Developer", email = "dev@example.com"}]
dependencies = [
    "fastapi>=0.104.1",
    "cohere>=4.34",
    "qdrant-client>=1.9.1",
    "pydantic>=2.5.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.2",
    "typing-extensions>=4.0.0",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "isort>=5.12.0"
]

[project.scripts]
retrieval-service = "src.main:app"